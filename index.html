<body>
<div class="splash">
  <span class="dot"></span>
  <div class="word">Weiss</div>
  <div class="sub">Routing…</div>
</div>
<script>
(function () {
  // ── Router ───────────────────────────────────────────────
  // Query params:
  //   ?device=mobile|desktop|canvas   force a view
  //   ?demo=1                         hide tweaks (default on)
  //   ?tweaks=1                       show tweaks panel
  //   ?canvas=1                       open the full design canvas

  var qs = new URLSearchParams(location.search);
  var force = qs.get('device');
  var showCanvas = qs.get('canvas') === '1';
  var showTweaks = qs.get('tweaks') === '1';

  var ua = navigator.userAgent || '';
  var isMobile = /iPhone|iPod|Android.*Mobile|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  var isTablet = /iPad|Android(?!.*Mobile)|Tablet/i.test(ua);

  var device;
  if (force === 'mobile' || force === 'desktop' || force === 'canvas') {
    device = force;
  } else if (showCanvas) {
    device = 'canvas';
  } else if (isMobile) {
    device = 'mobile';
  } else {
    // Desktop + tablet → full canvas (they've got the screen real-estate)
    device = 'canvas';
  }

  var target = 'Weiss.html?view=' + device;
  if (showTweaks) target += '&tweaks=1';

  // Tiny delay so the splash isn't jarring
  setTimeout(function () { location.replace(target); }, 250);

  // Safety net — if Weiss.html never takes over within 8s, show an error
  // instead of leaving the user on a blank cream page.
  setTimeout(function () {
    try {
      document.querySelector('.sub').textContent =
        'If you see this, Weiss.html failed to load. Open DevTools → Console.';
      document.querySelector('.dot').style.background = '#F59E0B';
    } catch (e) {}
  }, 8000);
})();
</script>
